<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Kensington MagPro Magnetic Privacy Screen for 14\" Laptops (16:9)","description":"The patented MagPro 14.0\" (16:9) Laptop Privacy Screen with Magnetic Strip offers best-in-class privacy protection. It can be attached and removed quickly and easily, while allowing your laptop to close and enter sleep mode without removing. An excellent solution for slim bezel or edge-to-edge displays. Screen protects monitor from scratches and damage, while providing privacy by limiting viewing angle to +/- 30°. Reduces harmful blue light by up to 22%, diminishes glare, and improves clarity. Reversible for matte or glossy viewing options. Includes anti-bacterial cleaning cloth and protective case to help prevent scratches when not in use. TAA-compliant.","url":"https://www.lenovo.com/us/en/p/accessories-and-software/privacy-and-protection/privacy-filters-black/78531362","brand":"Kensington","review":[],"image":"https://p1-ofp.static.pub//medias/7ADE32BB-1142-4491-8A5D-E8563A7B3622_400x300_1775521959448.jpg","sku":"78531362","offers":{"@type":"Offer","url":"https://www.lenovo.com/us/en/p/accessories-and-software/privacy-and-protection/privacy-filters-black/78531362","priceCurrency":"USD","price":60.99,"availability":"https://schema.org/InStock"},"color":""}</script>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Kensington MagPro Magnetic Privacy Screen for 14\" Laptops (16:10)","description":"Designed to support today's ultra-thin laptops with exceptional form, fit, and function, the MagPro Magnetic Privacy Screen for Laptops (16:10) easily attaches and detaches as needed, allows full device closure and sleep mode functionality without removal, and provides professional-grade privacy screen protection. The privacy filter narrows the viewing angle to +/- 30° to increase visual security and decrease the chance of visual hacking. A webcam notch supports an unhindered video conferencing experience. Blue light reduction filters out harmful rays by up to 30%, easing eye strain and reducing the chances of interruptions to your natural sleep patterns. Reversible screen includes low reflective coating for improved viewing clarity. One side has a matte finish to reduce glare and fingerprints. The other side is glossy and provides a clearer view of the monitor. The anti-glare/matte surface uses a special antimicrobial film coating that prevents mildew and bacteria growth, which can cause stains and odors on the film. The patented magnetic design is convenient and avoids the challenges of potentially damaging adhesives. TAA compliant. Includes two-year limited warranty.","url":"https://www.lenovo.com/us/en/p/accessories-and-software/privacy-and-protection/privacy-filters-black/78531266","brand":"Kensington","review":[],"image":"https://p1-ofp.static.pub//medias/83F6D2F7-7442-41D0-A0B5-5C2E7A1C09BB_800x600_1745388493438.jpg","sku":"78531266","offers":{"@type":"Offer","url":"https://www.lenovo.com/us/en/p/accessories-and-software/privacy-and-protection/privacy-filters-black/78531266","priceCurrency":"USD","price":60.99,"availability":"https://schema.org/InStock"},"color":""}</script>
