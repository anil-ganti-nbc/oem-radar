# Fixtures: tests/fixtures/woocommerce/geekom_*.
manufacturer:
  name: GEEKOM
  country: TW
sources:
  - id: geekom-wc
    engine: woocommerce_store_api
    base_url: https://www.geekompc.com
    min_interval: 12h
    enabled: true
