# support_status: LIVE_VALIDATED — WooCommerce Store API confirmed live
# Stage 5 (77 real products), engine built and enabled Stage 7 (2026-08-07).
# The old audit note claiming this storefront was BROKEN (404/lander
# redirect) was wrong/stale — geekompc.com is a real, working WooCommerce
# site. Most products are `type: "variable"` (RAM/storage configs); this
